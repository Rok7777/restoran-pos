<!DOCTYPE html>
<html lang="sl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Restavracija POS</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f5f5f5; overscroll-behavior: none; }
.app { display: flex; height: 100dvh; max-width: 480px; margin: 0 auto; background: #f5f5f5; }
.tables-col { width: 64px; min-width: 64px; background: #fff; border-right: 1px solid #e5e5e5; display: flex; flex-direction: column; align-items: center; padding: 8px 0; gap: 6px; overflow-y: auto; }
.table-pill { width: 48px; height: 48px; border-radius: 8px; border: 1px solid #e5e5e5; background: #fff; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; flex-shrink: 0; -webkit-tap-highlight-color: transparent; }
.table-pill.has-items { border-color: #378ADD; background: #E6F1FB; }
.table-pill.active { border: 2px solid #1D9E75; background: #E1F5EE; }
.table-pill.sent { border-color: #EF9F27; background: #FAEEDA; }
.table-pill.active.sent { border: 2px solid #EF9F27; background: #FAEEDA; }
.table-pill .t-num { font-size: 15px; font-weight: 600; color: #111; }
.table-pill .t-dot { width: 6px; height: 6px; border-radius: 50%; background: #378ADD; margin-top: 3px; }
.table-pill.active .t-num { color: #0F6E56; }
.table-pill.active .t-dot { background: #1D9E75; }
.table-pill.has-items:not(.active):not(.sent) .t-num { color: #185FA5; }
.table-pill.sent .t-num { color: #854F0B; }
.table-pill.sent .t-dot { background: #EF9F27; }
.settings-pill { margin-top: auto; background: #f5f5f5; font-size: 18px; }
.order-col { flex: 1; display: flex; flex-direction: column; overflow: hidden; background: #fff; }
.topbar { padding: 10px 12px; border-bottom: 1px solid #e5e5e5; display: flex; align-items: center; justify-content: space-between; min-height: 44px; }
.topbar-title { font-size: 14px; font-weight: 600; color: #111; }
.status-badge { display: inline-flex; align-items: center; gap: 4px; padding: 3px 8px; border-radius: 20px; font-size: 11px; }
.status-badge.ok { background: #E1F5EE; color: #0F6E56; }
.status-badge.err { background: #FCEBEB; color: #A32D2D; }
.order-items { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; }
.order-row-wrap { position: relative; overflow: hidden; }
.delete-bg { position: absolute; right: 0; top: 0; bottom: 0; width: 80px; background: #E24B4A; display: flex; align-items: center; justify-content: center; color: white; font-size: 13px; font-weight: 500; }
.order-row { display: flex; align-items: center; gap: 8px; padding: 10px 12px; border-bottom: 1px solid #f0f0f0; background: #fff; position: relative; transition: transform 0.15s ease; will-change: transform; }
.order-row.no-cid { background: #FFFBF0; }
.order-row:last-child { border-bottom: none; }
.order-row-name { flex: 1; font-size: 13px; color: #111; line-height: 1.3; }
.order-row-price { font-size: 12px; color: #666; min-width: 50px; text-align: right; }
.no-cid-tag { font-size: 10px; color: #EF9F27; display: block; }
.qty-ctrl { display: flex; align-items: center; gap: 4px; }
.qty-btn { width: 28px; height: 28px; border-radius: 50%; border: 1px solid #ddd; background: #f5f5f5; cursor: pointer; font-size: 16px; display: flex; align-items: center; justify-content: center; color: #111; -webkit-tap-highlight-color: transparent; }
.qty-num { font-size: 13px; font-weight: 600; min-width: 18px; text-align: center; }
.dropdown-section { border-top: 3px solid #EF9F27; background: #fff; }
.dropdown-toggle { width: 100%; padding: 10px 12px; display: flex; align-items: center; justify-content: space-between; background: #FAEEDA; border: none; font-size: 13px; font-weight: 600; color: #854F0B; cursor: pointer; -webkit-tap-highlight-color: transparent; }
.dropdown-toggle .arrow { font-size: 10px; transition: transform 0.2s; }
.dropdown-toggle.open .arrow { transform: rotate(180deg); }
.dropdown-list { max-height: 0; overflow: hidden; transition: max-height 0.25s ease; }
.dropdown-list.open { max-height: 320px; overflow-y: auto; }
.dropdown-cat { padding: 6px 12px 2px; font-size: 11px; font-weight: 600; color: #aaa; text-transform: uppercase; letter-spacing: 0.5px; background: #fafafa; }
.dropdown-item { padding: 11px 12px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #f5f5f5; cursor: pointer; -webkit-tap-highlight-color: transparent; transition: background 0.1s; }
.dropdown-item:active { background: #E1F5EE; }
.dropdown-item-name { font-size: 13px; color: #111; }
.dropdown-item-price { font-size: 13px; color: #185FA5; font-weight: 500; }
.empty-state { text-align: center; padding: 30px 20px; color: #aaa; font-size: 13px; }
.order-footer { padding: 10px 12px; border-top: 1px solid #e5e5e5; background: #fff; }
.total-row { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 10px; }
.total-label { font-size: 13px; color: #666; }
.total-amount { font-size: 24px; font-weight: 700; color: #111; }
.btn-checkout { width: 100%; padding: 13px; background: #1D9E75; color: white; border: none; border-radius: 10px; font-size: 14px; font-weight: 600; cursor: pointer; margin-bottom: 7px; -webkit-tap-highlight-color: transparent; }
.btn-checkout:disabled { background: #e0e0e0; color: #aaa; cursor: not-allowed; }
.btn-checkout.needs-setup { background: #E24B4A; }
.btn-clear { width: 100%; padding: 8px; background: transparent; color: #888; border: 1px solid #e5e5e5; border-radius: 8px; font-size: 12px; cursor: pointer; }
.btn-clear:disabled { opacity: 0.4; cursor: not-allowed; }
.modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.45); display: flex; align-items: flex-end; z-index: 100; }
.modal { background: #fff; border-radius: 16px 16px 0 0; padding: 20px; width: 100%; max-height: 85vh; overflow-y: auto; }
.modal h3 { font-size: 16px; font-weight: 600; margin-bottom: 8px; }
.modal p { font-size: 13px; color: #666; white-space: pre-line; line-height: 1.6; }
.modal-btns { display: flex; gap: 8px; margin-top: 16px; }
.modal-btns button { flex: 1; padding: 12px; border-radius: 10px; font-size: 14px; font-weight: 500; cursor: pointer; border: 1px solid #e5e5e5; background: #f5f5f5; color: #111; }
.modal-btns button.primary { background: #1D9E75; color: white; border-color: #1D9E75; }
.modal-btns button.warning { background: #EF9F27; color: white; border-color: #EF9F27; }
.settings-form label { display: block; font-size: 12px; color: #666; margin-bottom: 4px; margin-top: 14px; font-weight: 500; }
.settings-form input { width: 100%; padding: 10px 12px; border-radius: 8px; border: 1px solid #ccc; background: #f9f9f9; font-size: 14px; color: #111; font-family: inherit; }
.settings-info { font-size: 11px; color: #aaa; margin-top: 8px; line-height: 1.6; }
.toast { position: fixed; top: 16px; left: 50%; transform: translateX(-50%); background: #1D9E75; color: white; padding: 10px 18px; border-radius: 10px; font-size: 13px; font-weight: 500; z-index: 200; white-space: nowrap; box-shadow: 0 2px 12px rgba(0,0,0,0.15); }
.toast.err { background: #E24B4A; }
.toast.warn { background: #EF9F27; }
.warning-box { background: #FFFBF0; border: 1px solid #EF9F27; border-radius: 8px; padding: 10px 12px; margin-bottom: 12px; font-size: 12px; color: #854F0B; line-height: 1.6; }
</style>
</head>
<body>
<div class="app">
  <div class="tables-col" id="tablesCol"></div>
  <div class="order-col" id="orderCol"></div>
</div>
<script>
const MENU = [
  { id:1,  name:'Grof Rosé',                       cat:'Sveža vina',         price:14,   cid:'GROFROSE' },
  { id:2,  name:'Grof White 2021',                  cat:'Sveža vina',         price:14,   cid:'000037' },
  { id:3,  name:'Grof Rosso',                       cat:'Sveža vina',         price:20,   cid:'000105' },
  { id:4,  name:'Grof Pinela',                      cat:'Vipavska avtohtona', price:14,   cid:'GROFPINELA' },
  { id:5,  name:'Grof Poljšakica 2022',             cat:'Vipavska avtohtona', price:14,   cid:'GROFPOLJŠAKICA' },
  { id:6,  name:'Grof Zelen 2023',                  cat:'Vipavska avtohtona', price:14,   cid:'000040' },
  { id:7,  name:'Grof Chardonnay 2023',             cat:'Druga bela',         price:14,   cid:'000038' },
  { id:8,  name:'Grof Sauvignon 2021',              cat:'Druga bela',         price:14,   cid:'000039' },
  { id:9,  name:'Grof Rebula',                      cat:'Druga bela',         price:14,   cid:'GROFREBULA' },
  { id:10, name:'Grof Rebula klasična metoda 2021', cat:'Penina',             price:27,   cid:'000054' },
  { id:11, name:'Voda Panna 0,75l',                 cat:'Voda',               price:3,    cid:'000066' },
  { id:12, name:'San Pellegrino 0,75l',             cat:'Voda',               price:3,    cid:'000067' },
  { id:13, name:'Radenska 0,5l',                    cat:'Voda',               price:3,    cid:null },
  { id:14, name:'Grof Rosé – kozarec',              cat:'Vina na kozarec',    price:3.5,  cid:'GROFROSEK' },
  { id:15, name:'Grof White 2021 – kozarec',        cat:'Vina na kozarec',    price:4,    cid:'000077' },
  { id:16, name:'Grof Rosso – kozarec',             cat:'Vina na kozarec',    price:5,    cid:'000106' },
  { id:17, name:'Grof Pinela – kozarec',            cat:'Vina na kozarec',    price:4,    cid:'GROFPINELAK' },
  { id:18, name:'Grof Poljšakica 2021 – kozarec',   cat:'Vina na kozarec',    price:4,    cid:'GROFPOLJŠAKICAK' },
  { id:19, name:'Grof Zelen 2023 – kozarec',        cat:'Vina na kozarec',    price:4,    cid:'000078' },
  { id:20, name:'Grof Chardonnay 2023 – kozarec',   cat:'Vina na kozarec',    price:4,    cid:'000074' },
  { id:21, name:'Grof Sauvignon 2021 – kozarec',    cat:'Vina na kozarec',    price:4,    cid:'000076' },
  { id:22, name:'Grof Rebula – kozarec',            cat:'Vina na kozarec',    price:4,    cid:'GROFREBULAK' },
  { id:23, name:'Mali Crudo',                       cat:'Hrana',              price:22,   cid:'000103' },
  { id:24, name:'Veliki Crudo',                     cat:'Hrana',              price:33,   cid:'000104' },
  { id:25, name:'Škampi Jadran III.',               cat:'Hrana',              price:45,   cid:'SKAZH3000' },
  { id:26, name:'Kava',                             cat:'Pijače',             price:2,    cid:'000102' },
];

const CATS = [...new Set(MENU.map(i => i.cat))];
const NUM_TABLES = 10;
const BASE_URL = 'https://moj.shopsy.si/m2m2v4b0/Shopsy_API/';
const STORE_ID = 6001;
const CUSTOMER_CID = '000001';
const EMAIL = 'natasa@oltre-con.com';

let selectedTable = null;
let dropdownOpen = false;
let settings = { password: localStorage.getItem("shopsy_pass") || "" };

const JSONBIN_ID = "6a2f9986f5f4af5e29f3555a";
const JSONBIN_KEY = "$2a$10$IBGvib8ASeB8LqVLUt4L7OCwpwZeuOMkeIHWkm33sfm66B7C9rXd2";
const JSONBIN_URL = `https://api.jsonbin.io/v3/b/${JSONBIN_ID}`;

async function loadFromCloud() {
  try {
    const r = await fetch(JSONBIN_URL + "/latest", {
      headers: { "X-Master-Key": JSONBIN_KEY }
    });
    if(r.ok) {
      const d = await r.json();
      const data = d.record;
      for(let i=1;i<=NUM_TABLES;i++) {
        if(data[i]) orders[i] = data[i];
      }
      renderAll();
    }
  } catch(e) { console.error("Cloud load error:", e); }
}

async function saveToCloud() {
  try {
    await fetch(JSONBIN_URL, {
      method: "PUT",
      headers: { "X-Master-Key": JSONBIN_KEY, "Content-Type": "application/json" },
      body: JSON.stringify(orders)
    });
  } catch(e) { console.error("Cloud save error:", e); }
}

function loadOrders() {
  try {
    const raw = localStorage.getItem('pos_orders');
    if(raw) return JSON.parse(raw);
  } catch {}
  const o = {};
  for(let i=1;i<=NUM_TABLES;i++) o[i] = { items: [], sent: false };
  return o;
}
function saveOrders() {
  localStorage.setItem("pos_orders", JSON.stringify(orders));
  saveToCloud();
}
let orders = loadOrders();

const fmt = n => n.toFixed(2).replace('.',',') + ' €';
const tableTotal = t => (orders[t]?.items||[]).reduce((s,i)=>s+i.price*i.qty,0);
const tableCount = t => (orders[t]?.items||[]).reduce((s,i)=>s+i.qty,0);
const getAuth = () => 'Basic ' + btoa(EMAIL + ':' + settings.password);

async function getServiceUrl() {
  try {
    const r = await fetch(BASE_URL + 'serviceUrl', { headers: { 'Authorization': getAuth() } });
    if(!r.ok) return null;
    const d = await r.json();
    return (d.serviceUrl || d.ServiceUrl || BASE_URL).replace(/\/?$/, '/');
  } catch { return null; }
}

async function getCustomerId(apiUrl) {
  try {
    const r = await fetch(apiUrl + 'customers?count=100&offset=0', { headers: { 'Authorization': getAuth() } });
    if(!r.ok) return null;
    const d = await r.json();
    const arr = d.customers || d.Customers || d;
    if(Array.isArray(arr)) {
      const k = arr.find(c => (c.cid||c.Cid||'') === CUSTOMER_CID || (c.name||c.Name||'').toUpperCase().includes('KONČNI'));
      return k ? (k.id || k.Id) : null;
    }
  } catch { return null; }
}

async function sendToShopsy(tableNum) {
  if(!settings.password) { showToast('Nastavi geslo v nastavitvah ⚙️', true); return; }
  const allItems = orders[tableNum]?.items || [];
  if(!allItems.length) return;

  const withCid = allItems.filter(i => i.cid);
  const withoutCid = allItems.filter(i => !i.cid);

  if(withoutCid.length > 0 && withCid.length === 0) {
    showToast('Nobeden artikel nima šifre — prenos ni možen', true);
    return;
  }

  if(withoutCid.length > 0) {
    const names = withoutCid.map(i => `• ${i.name}`).join('\n');
    showWarningModal(
      '⚠️ Nekateri artikli nimajo šifre',
      `Spodnji artikli ne bodo preneseni v Shopsy:\n${names}\n\nOstali artikli bodo preneseni normalno.`,
      () => doSend(tableNum, withCid, withoutCid)
    );
    return;
  }

  doSend(tableNum, withCid, []);
}

async function doSend(tableNum, withCid, withoutCid) {
  showToast('⏳ Pošiljam v Shopsy...', false, true);
  try {
    const apiUrl = await getServiceUrl();
    if(!apiUrl) { showToast('Napaka pri prijavi — preveri geslo', true); return; }
    const custId = await getCustomerId(apiUrl);

    const body = {
      IsDraft: true,
      StoreId: STORE_ID,
      CustomerId: custId || undefined,
      CustomerCid: custId ? undefined : CUSTOMER_CID,
      Note: 'Miza ' + tableNum,
      DocumentItems: withCid.map(item => ({
        ItemCid: item.cid,
        Quantity: item.qty,
        Price: item.price,
        DiscountPercentage: 0
      }))
    };

    const r = await fetch(apiUrl + 'v2/documents/customerOrders', {
      method: 'POST',
      headers: { 'Authorization': getAuth(), 'Content-Type': 'application/json' },
      body: JSON.stringify(body)
    });

    document.querySelector('.toast')?.remove();

    if(r.ok) {
      orders[tableNum].sent = true;
      saveOrders();
      renderAll();
      if(withoutCid.length > 0) {
        const names = withoutCid.map(i => i.name).join(', ');
        showToast(`✓ Poslano! Ni preneseno: ${names}`, false);
        setTimeout(() => showToast(`⚠️ Manjka šifra: ${names}`, 'warn'), 3500);
      } else {
        showToast('✓ Osnutek poslan v Shopsy!');
      }
    } else {
      const e = await r.text();
      showToast('Napaka ' + r.status + ': ' + e.substring(0,60), true);
    }
  } catch(e) {
    document.querySelector('.toast')?.remove();
    showToast('Napaka pri povezavi', true);
  }
}

function showToast(msg, isErr=false, persist=false) {
  document.querySelector('.toast')?.remove();
  const el = document.createElement('div');
  el.className = 'toast' + (isErr===true?' err': isErr==='warn'?' warn':'');
  el.innerHTML = msg;
  document.body.appendChild(el);
  if(!persist) setTimeout(()=>el.remove(), 4000);
}

function showWarningModal(title, msg, onConfirm) {
  const o = document.createElement('div');
  o.className = 'modal-overlay';
  o.innerHTML = `<div class="modal">
    <h3>${title}</h3>
    <p style="margin-bottom:0">${msg}</p>
    <div class="modal-btns">
      <button onclick="this.closest('.modal-overlay').remove()">Prekliči</button>
      <button class="warning" onclick="confirmWarning()">Pošlji brez njih</button>
    </div>
  </div>`;
  document.body.appendChild(o);
  window._warningConfirm = onConfirm;
}

function confirmWarning() {
  document.querySelector('.modal-overlay')?.remove();
  if(window._warningConfirm) window._warningConfirm();
}

function attachSwipe(wrap, id) {
  const row = wrap.querySelector('.order-row');
  let startX=0, curX=0, dragging=false;
  const THRESHOLD = 80;
  const onStart = e => { startX=e.touches?e.touches[0].clientX:e.clientX; curX=0; dragging=true; row.style.transition='none'; };
  const onMove = e => {
    if(!dragging) return;
    const x=(e.touches?e.touches[0].clientX:e.clientX)-startX;
    if(x>0) return;
    curX=x; row.style.transform=`translateX(${Math.max(x,-THRESHOLD)}px)`;
    if(e.cancelable) e.preventDefault();
  };
  const onEnd = () => {
    if(!dragging) return; dragging=false;
    row.style.transition='transform 0.2s ease';
    if(curX<=-THRESHOLD){ row.style.transform='translateX(-100%)'; setTimeout(()=>removeItem(id),200); }
    else row.style.transform='translateX(0)';
  };
  wrap.addEventListener('touchstart', onStart, {passive:true});
  wrap.addEventListener('touchmove', onMove, {passive:false});
  wrap.addEventListener('touchend', onEnd);
  wrap.addEventListener('mousedown', onStart);
  window.addEventListener('mousemove', onMove);
  window.addEventListener('mouseup', onEnd);
}

function removeItem(id) {
  if(!selectedTable) return;
  orders[selectedTable].items = orders[selectedTable].items.filter(i=>i.id!==id);
  saveOrders(); renderTables(); renderOrderItems();
}

function renderTables() {
  const col = document.getElementById('tablesCol');
  col.innerHTML = '';
  for(let i=1;i<=NUM_TABLES;i++) {
    const cnt=tableCount(i), isActive=selectedTable===i, sent=orders[i]?.sent, hasItems=cnt>0;
    const btn=document.createElement('button');
    let cls='table-pill';
    if(isActive&&sent) cls+=' active sent';
    else if(isActive) cls+=' active';
    else if(sent) cls+=' sent';
    else if(hasItems) cls+=' has-items';
    btn.className=cls;
    btn.innerHTML=`<span class="t-num">${i}</span>${(hasItems||isActive)?'<span class="t-dot"></span>':''}`;
    btn.onclick=()=>{ selectedTable=i; dropdownOpen=false; renderAll(); };
    col.appendChild(btn);
  }
  const sp=document.createElement('div'); sp.style.flex='1'; col.appendChild(sp);
  const sb=document.createElement('button');
  sb.className='table-pill settings-pill'; sb.title='Nastavitve'; sb.textContent='⚙️';
  sb.onclick=showSettings; col.appendChild(sb);
}

function buildDropdownList() {
  let html='';
  for(const cat of CATS) {
    html+=`<div class="dropdown-cat">${cat}</div>`;
    MENU.filter(i=>i.cat===cat).forEach(item=>{
      html+=`<div class="dropdown-item" onclick="addItem(${item.id})">
        <span class="dropdown-item-name">${item.name}${!item.cid?' <span style="font-size:10px;color:#EF9F27">⚠ brez šifre</span>':''}</span>
        <span class="dropdown-item-price">${fmt(item.price)}</span>
      </div>`;
    });
  }
  return html;
}

function toggleDropdown() {
  dropdownOpen=!dropdownOpen;
  document.getElementById('dropdownList')?.classList.toggle('open', dropdownOpen);
  document.getElementById('dropdownToggle')?.classList.toggle('open', dropdownOpen);
}

function addItem(id) {
  if(!selectedTable) return;
  const item=MENU.find(i=>i.id===id);
  if(!item) return;
  const items=orders[selectedTable].items;
  const ex=items.find(i=>i.id===id);
  if(ex) ex.qty++; else items.push({...item,qty:1});
  orders[selectedTable].sent=false;
  saveOrders(); renderTables(); renderOrderItems();
}

function changeQty(id, delta) {
  if(!selectedTable) return;
  const items=orders[selectedTable].items;
  const idx=items.findIndex(i=>i.id===id);
  if(idx<0) return;
  items[idx].qty+=delta;
  if(items[idx].qty<=0) items.splice(idx,1);
  saveOrders(); renderTables(); renderOrderItems();
}

function renderOrderItems() {
  const container=document.getElementById('orderItemsContainer');
  const totalEl=document.getElementById('totalAmount');
  const btnCheckout=document.getElementById('btnCheckout');
  const btnClear=document.getElementById('btnClear');
  if(!container) return;
  const items=selectedTable?orders[selectedTable].items:[];
  const total=selectedTable?tableTotal(selectedTable):0;
  const missingCid=items.filter(i=>!i.cid);

  if(!items.length) {
    container.innerHTML=`<div class="empty-state">${selectedTable?'Dodaj artikel spodaj':'👆 Izberi mizo na levi'}</div>`;
  } else {
    container.innerHTML='';
    if(missingCid.length>0) {
      const warn=document.createElement('div');
      warn.className='warning-box';
      warn.innerHTML=`⚠️ Brez šifre (ne bodo preneseni): ${missingCid.map(i=>i.name).join(', ')}`;
      container.appendChild(warn);
    }
    items.forEach(item=>{
      const wrap=document.createElement('div');
      wrap.className='order-row-wrap';
      wrap.innerHTML=`
        <div class="delete-bg">Briši</div>
        <div class="order-row${!item.cid?' no-cid':''}">
          <div class="order-row-name">
            ${item.name}
            ${!item.cid?'<span class="no-cid-tag">⚠ brez šifre</span>':''}
          </div>
          <div class="qty-ctrl">
            <button class="qty-btn" onclick="changeQty(${item.id},-1)">−</button>
            <span class="qty-num">${item.qty}</span>
            <button class="qty-btn" onclick="changeQty(${item.id},1)">+</button>
          </div>
          <div class="order-row-price">${fmt(item.price*item.qty)}</div>
        </div>`;
      container.appendChild(wrap);
      attachSwipe(wrap, item.id);
    });
  }
  if(totalEl) totalEl.textContent=fmt(total);
  if(btnCheckout) btnCheckout.disabled=!items.length;
  if(btnClear) btnClear.disabled=!items.length;
}

function renderOrder() {
  const col=document.getElementById('orderCol');
  const hasPass=!!settings.password;
  const noTable=!selectedTable;
  const badge=hasPass
    ?'<span class="status-badge ok">● Shopsy</span>'
    :'<span class="status-badge err">⚠ Nastavi geslo</span>';

  col.innerHTML=`
    <div class="topbar">
      <span class="topbar-title">${selectedTable?'Miza '+selectedTable:'Naročilo'}</span>
      ${badge}
    </div>
    <div class="order-items" id="orderItemsContainer"></div>
    <div class="dropdown-section">
      <button class="dropdown-toggle" id="dropdownToggle" onclick="toggleDropdown()" ${noTable?'disabled':''}>
        <span>+ Dodaj artikel</span>
        <span class="arrow">▼</span>
      </button>
      <div class="dropdown-list" id="dropdownList">${buildDropdownList()}</div>
    </div>
    <div class="order-footer">
      <div class="total-row">
        <span class="total-label">Skupaj</span>
        <span class="total-amount" id="totalAmount">${fmt(selectedTable?tableTotal(selectedTable):0)}</span>
      </div>
      <button id="btnCheckout" class="btn-checkout ${!hasPass?'needs-setup':''}" onclick="${hasPass?'checkout()':'showSettings()'}" disabled>
        ${hasPass?'📤 Pošlji v Shopsy':'⚙️ Nastavi geslo'}
      </button>
      <button id="btnClear" class="btn-clear" onclick="clearTable()" disabled>🗑 Počisti mizo</button>
    </div>`;
  renderOrderItems();
  if(dropdownOpen){
    document.getElementById('dropdownList')?.classList.add('open');
    document.getElementById('dropdownToggle')?.classList.add('open');
  }
}

function clearTable() {
  if(!selectedTable||!orders[selectedTable].items.length) return;
  if(confirm('Počisti mizo '+selectedTable+'?')) {
    orders[selectedTable]={items:[],sent:false};
    saveOrders(); renderAll();
  }
}

function checkout() {
  if(!selectedTable||!orders[selectedTable].items.length) return;
  sendToShopsy(selectedTable);
}

function showSettings() {
  const overlay=document.createElement('div');
  overlay.className='modal-overlay';
  overlay.innerHTML=`
    <div class="modal">
      <h3>⚙️ Shopsy nastavitve</h3>
      <div class="settings-form">
        <label>Email</label>
        <input type="text" value="${EMAIL}" disabled style="opacity:0.6;">
        <label>Geslo</label>
        <input type="password" id="settingsPass" placeholder="Vnesi geslo..." value="${settings.password}" autocomplete="current-password">
      </div>
      <p class="settings-info" style="margin-top:10px;">Store: Maloprodaja Orehovlje (6001)<br>Kupec: KONČNI KUPEC (000001)<br>Geslo se shrani lokalno v brskalnik.</p>
      <div class="modal-btns">
        <button onclick="this.closest('.modal-overlay').remove()">Zapri</button>
        <button class="primary" onclick="saveSettings()">Shrani</button>
      </div>
    </div>`;
  document.body.appendChild(overlay);
  setTimeout(()=>document.getElementById('settingsPass')?.focus(),100);
}

function saveSettings() {
  const p=document.getElementById('settingsPass');
  if(p){settings.password=p.value.trim();localStorage.setItem('shopsy_pass',settings.password);}
  document.querySelector('.modal-overlay')?.remove();
  renderOrder();
  showToast('Nastavitve shranjene');
}

function renderAll() { renderTables(); renderOrder(); }
// Load from cloud on startup, fallback to localStorage
loadFromCloud().catch(() => renderAll());
</script>
</body>
</html>
