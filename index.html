<!DOCTYPE html>
<html lang="sl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Restavracija POS</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f5f5f5; }
.app { display: flex; height: 100dvh; max-width: 480px; margin: 0 auto; background: #f5f5f5; }
.tables-col { width: 64px; min-width: 64px; background: #fff; border-right: 1px solid #e5e5e5; display: flex; flex-direction: column; align-items: center; padding: 8px 0; gap: 6px; overflow-y: auto; }
.table-pill { width: 48px; height: 48px; border-radius: 8px; border: 1px solid #e5e5e5; background: #fff; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; transition: all 0.15s; flex-shrink: 0; -webkit-tap-highlight-color: transparent; }
.table-pill:hover { background: #f5f5f5; }
.table-pill.has-items { border-color: #378ADD; background: #E6F1FB; }
.table-pill.active { border: 2px solid #1D9E75; background: #E1F5EE; }
.table-pill .t-num { font-size: 15px; font-weight: 600; color: #111; }
.table-pill .t-dot { width: 6px; height: 6px; border-radius: 50%; background: #378ADD; margin-top: 3px; }
.table-pill.active .t-num { color: #0F6E56; }
.table-pill.active .t-dot { background: #1D9E75; }
.table-pill.has-items:not(.active) .t-num { color: #185FA5; }
.settings-pill { margin-top: auto; background: #f5f5f5; }
.order-col { flex: 1; display: flex; flex-direction: column; overflow: hidden; background: #fff; }
.topbar { padding: 10px 12px; border-bottom: 1px solid #e5e5e5; display: flex; align-items: center; justify-content: space-between; min-height: 44px; background: #fff; }
.topbar-title { font-size: 14px; font-weight: 600; color: #111; }
.status-badge { display: inline-flex; align-items: center; gap: 4px; padding: 3px 8px; border-radius: 20px; font-size: 11px; }
.status-badge.ok { background: #E1F5EE; color: #0F6E56; }
.status-badge.err { background: #FCEBEB; color: #A32D2D; }
.add-section { padding: 10px 12px; border-bottom: 1px solid #e5e5e5; display: flex; gap: 8px; align-items: center; background: #fff; }
.add-section select { flex: 1; padding: 8px 10px; border-radius: 8px; border: 1px solid #ccc; background: #f5f5f5; font-size: 13px; color: #111; font-family: inherit; }
.add-section select:disabled { opacity: 0.5; }
.btn-add { width: 38px; height: 38px; border-radius: 50%; background: #E1F5EE; border: none; color: #0F6E56; font-size: 24px; cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0; -webkit-tap-highlight-color: transparent; }
.btn-add:disabled { background: #f0f0f0; color: #aaa; cursor: not-allowed; }
.order-items { flex: 1; overflow-y: auto; padding: 6px 8px; -webkit-overflow-scrolling: touch; }
.order-row { display: flex; align-items: center; gap: 8px; padding: 9px 8px; border-bottom: 1px solid #f0f0f0; }
.order-row:last-child { border-bottom: none; }
.order-row-name { flex: 1; font-size: 13px; color: #111; line-height: 1.3; }
.order-row-price { font-size: 12px; color: #666; min-width: 50px; text-align: right; }
.qty-ctrl { display: flex; align-items: center; gap: 4px; }
.qty-btn { width: 28px; height: 28px; border-radius: 50%; border: 1px solid #ddd; background: #f5f5f5; cursor: pointer; font-size: 16px; display: flex; align-items: center; justify-content: center; color: #111; -webkit-tap-highlight-color: transparent; }
.qty-num { font-size: 13px; font-weight: 600; min-width: 18px; text-align: center; }
.empty-state { text-align: center; padding: 40px 20px; color: #aaa; font-size: 13px; }
.order-footer { padding: 10px 12px; border-top: 1px solid #e5e5e5; background: #fff; }
.total-row { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 10px; }
.total-label { font-size: 13px; color: #666; }
.total-amount { font-size: 24px; font-weight: 700; color: #111; }
.btn-checkout { width: 100%; padding: 13px; background: #1D9E75; color: white; border: none; border-radius: 10px; font-size: 14px; font-weight: 600; cursor: pointer; margin-bottom: 7px; -webkit-tap-highlight-color: transparent; }
.btn-checkout:disabled { background: #e0e0e0; color: #aaa; cursor: not-allowed; }
.btn-checkout.needs-setup { background: #E24B4A; }
.btn-clear { width: 100%; padding: 8px; background: transparent; color: #888; border: 1px solid #e5e5e5; border-radius: 8px; font-size: 12px; cursor: pointer; }
.btn-clear:disabled { opacity: 0.4; cursor: not-allowed; }
.modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.45); display: flex; align-items: flex-end; z-index: 100; }
.modal { background: #fff; border-radius: 16px 16px 0 0; padding: 20px; width: 100%; border-top: 1px solid #e5e5e5; max-height: 85vh; overflow-y: auto; }
.modal h3 { font-size: 16px; font-weight: 600; margin-bottom: 8px; }
.modal p { font-size: 13px; color: #666; margin-bottom: 4px; white-space: pre-line; line-height: 1.6; }
.modal-btns { display: flex; gap: 8px; margin-top: 16px; }
.modal-btns button { flex: 1; padding: 12px; border-radius: 10px; font-size: 14px; font-weight: 500; cursor: pointer; border: 1px solid #e5e5e5; background: #f5f5f5; color: #111; }
.modal-btns button.primary { background: #1D9E75; color: white; border-color: #1D9E75; }
.settings-form label { display: block; font-size: 12px; color: #666; margin-bottom: 4px; margin-top: 14px; font-weight: 500; }
.settings-form input { width: 100%; padding: 10px 12px; border-radius: 8px; border: 1px solid #ccc; background: #f9f9f9; font-size: 14px; color: #111; font-family: inherit; }
.settings-form input:focus { outline: none; border-color: #1D9E75; }
.settings-info { font-size: 11px; color: #aaa; margin-top: 8px; line-height: 1.6; }
.toast { position: fixed; top: 16px; left: 50%; transform: translateX(-50%); background: #1D9E75; color: white; padding: 10px 18px; border-radius: 10px; font-size: 13px; font-weight: 500; z-index: 200; white-space: nowrap; box-shadow: 0 2px 12px rgba(0,0,0,0.15); }
.toast.err { background: #E24B4A; }
.spinner { display: inline-block; width: 14px; height: 14px; border: 2px solid rgba(255,255,255,0.4); border-top-color: white; border-radius: 50%; animation: spin 0.6s linear infinite; vertical-align: middle; margin-right: 6px; }
@keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<div class="app">
  <div class="tables-col" id="tablesCol"></div>
  <div class="order-col" id="orderCol"></div>
</div>

<script>
const MENU = [
  { id:1,  name:'Grof Rosé',                       cat:'Sveža vina',         price:14  },
  { id:2,  name:'Grof White 2021',                  cat:'Sveža vina',         price:14  },
  { id:3,  name:'Grof Rosso',                       cat:'Sveža vina',         price:20  },
  { id:4,  name:'Grof Pinela',                      cat:'Vipavska avtohtona', price:14  },
  { id:5,  name:'Grof Poljšakica 2022',             cat:'Vipavska avtohtona', price:14  },
  { id:6,  name:'Grof Zelen 2023',                  cat:'Vipavska avtohtona', price:14  },
  { id:7,  name:'Grof Chardonnay 2023',             cat:'Druga bela',         price:14  },
  { id:8,  name:'Grof Sauvignon 2021',              cat:'Druga bela',         price:14  },
  { id:9,  name:'Grof Rebula',                      cat:'Druga bela',         price:14  },
  { id:10, name:'Grof Rebula klasična metoda 2021', cat:'Penina',             price:27  },
  { id:11, name:'Voda Panna 0,75l',                 cat:'Voda',               price:3   },
  { id:12, name:'San Pellegrino 0,75l',             cat:'Voda',               price:3   },
  { id:13, name:'Radenska 0,5l',                    cat:'Voda',               price:3   },
  { id:14, name:'Grof Rosé – kozarec',              cat:'Vina na kozarec',    price:3.5 },
  { id:15, name:'Grof White 2021 – kozarec',        cat:'Vina na kozarec',    price:4   },
  { id:16, name:'Grof Rosso – kozarec',             cat:'Vina na kozarec',    price:5   },
  { id:17, name:'Grof Pinela – kozarec',            cat:'Vina na kozarec',    price:4   },
  { id:18, name:'Grof Poljšakica 2021 – kozarec',   cat:'Vina na kozarec',    price:4   },
  { id:19, name:'Grof Zelen 2023 – kozarec',        cat:'Vina na kozarec',    price:4   },
  { id:20, name:'Grof Chardonnay 2023 – kozarec',   cat:'Vina na kozarec',    price:4   },
  { id:21, name:'Grof Sauvignon 2021 – kozarec',    cat:'Vina na kozarec',    price:4   },
  { id:22, name:'Grof Rebula – kozarec',            cat:'Vina na kozarec',    price:4   },
  { id:23, name:'Mali Crudo',                       cat:'Hrana',              price:22  },
  { id:24, name:'Veliki Crudo',                     cat:'Hrana',              price:33  },
  { id:25, name:'Škampi Jadran III.',               cat:'Hrana',              price:45  },
];

const CATS = [...new Set(MENU.map(i => i.cat))];
const NUM_TABLES = 10;
const BASE_URL = 'https://moj.shopsy.si/m2m2v4b0/Shopsy_API/';
const STORE_ID = 6001;
const CUSTOMER_CID = '000001';
const EMAIL = 'natasa@oltre-con.com';

let selectedTable = null;
let orders = {};
for(let i=1;i<=NUM_TABLES;i++) orders[i]=[];
let settings = { password: localStorage.getItem('shopsy_pass') || '' };

const fmt = n => n.toFixed(2).replace('.',',') + ' €';
const tableTotal = t => (orders[t]||[]).reduce((s,i)=>s+i.price*i.qty,0);
const tableCount = t => (orders[t]||[]).reduce((s,i)=>s+i.qty,0);
const getAuth = () => 'Basic ' + btoa(EMAIL + ':' + settings.password);

async function getServiceUrl() {
  try {
    const r = await fetch(BASE_URL + 'serviceUrl', { headers: { 'Authorization': getAuth() } });
    if(!r.ok) return null;
    const d = await r.json();
    return (d.serviceUrl || d.ServiceUrl || BASE_URL).replace(/\/?$/, '/');
  } catch { return null; }
}

async function getCustomerId(apiUrl) {
  try {
    const r = await fetch(apiUrl + 'customers?count=100&offset=0', { headers: { 'Authorization': getAuth() } });
    if(!r.ok) return null;
    const d = await r.json();
    const arr = d.customers || d.Customers || d;
    if(Array.isArray(arr)) {
      const k = arr.find(c => (c.cid||c.Cid||'') === CUSTOMER_CID || (c.name||c.Name||'').toUpperCase().includes('KONČNI'));
      return k ? (k.id || k.Id) : null;
    }
  } catch { return null; }
}

async function sendToShopsy(tableNum) {
  if(!settings.password) { showToast('Nastavi geslo v nastavitvah ⚙️', true); return; }
  const order = orders[tableNum];
  if(!order.length) return;

  showToast('⏳ Pošiljam v Shopsy...', false, true);

  try {
    const apiUrl = await getServiceUrl();
    if(!apiUrl) { showToast('Napaka pri prijavi — preveri geslo', true); return; }

    const custId = await getCustomerId(apiUrl);

    const body = {
      IsDraft: true,
      StoreId: STORE_ID,
      CustomerId: custId || undefined,
      CustomerCid: custId ? undefined : CUSTOMER_CID,
      Note: 'Miza ' + tableNum,
      DocumentItems: order.map(item => ({
        ItemName: item.name,
        Quantity: item.qty,
        Price: item.price,
        DiscountPercentage: 0
      }))
    };

    const r = await fetch(apiUrl + 'v2/documents/customerOrders', {
      method: 'POST',
      headers: { 'Authorization': getAuth(), 'Content-Type': 'application/json' },
      body: JSON.stringify(body)
    });

    const t = document.querySelector('.toast');
    if(t) t.remove();

    if(r.ok) {
      orders[tableNum] = [];
      renderAll();
      showToast('✓ Osnutek poslan v Shopsy!');
    } else {
      const err = await r.text();
      showToast('Napaka ' + r.status + ': ' + err.substring(0,50), true);
    }
  } catch(e) {
    const t = document.querySelector('.toast');
    if(t) t.remove();
    showToast('Napaka pri povezavi', true);
  }
}

function showToast(msg, isErr=false, persist=false) {
  const ex = document.querySelector('.toast');
  if(ex) ex.remove();
  const el = document.createElement('div');
  el.className = 'toast' + (isErr?' err':'');
  el.innerHTML = msg;
  document.body.appendChild(el);
  if(!persist) setTimeout(() => el.remove(), 3000);
}

function renderTables() {
  const col = document.getElementById('tablesCol');
  col.innerHTML = '';
  for(let i=1;i<=NUM_TABLES;i++) {
    const cnt = tableCount(i);
    const isActive = selectedTable===i;
    const hasItems = cnt>0;
    const btn = document.createElement('button');
    btn.className = 'table-pill'+(isActive?' active':'')+(hasItems&&!isActive?' has-items':'');
    btn.innerHTML = `<span class="t-num">${i}</span>${(hasItems||isActive)?'<span class="t-dot"></span>':''}`;
    btn.onclick = () => { selectedTable=i; renderAll(); };
    col.appendChild(btn);
  }
  const sp = document.createElement('div'); sp.style.flex='1'; col.appendChild(sp);
  const sb = document.createElement('button');
  sb.className = 'table-pill settings-pill';
  sb.title = 'Nastavitve';
  sb.innerHTML = '⚙️';
  sb.style.fontSize = '18px';
  sb.onclick = showSettings;
  col.appendChild(sb);
}

function buildSelect() {
  let html = '<option value="">— izberi artikel —</option>';
  for(const cat of CATS) {
    html += `<optgroup label="${cat}">`;
    MENU.filter(i=>i.cat===cat).forEach(item => {
      html += `<option value="${item.id}">${item.name} – ${fmt(item.price)}</option>`;
    });
    html += '</optgroup>';
  }
  return html;
}

function renderOrder() {
  const col = document.getElementById('orderCol');
  const order = selectedTable ? orders[selectedTable] : [];
  const total = selectedTable ? tableTotal(selectedTable) : 0;
  const noTable = !selectedTable;
  const hasPass = !!settings.password;

  const rows = (selectedTable && order.length)
    ? order.map(item=>`
      <div class="order-row">
        <div class="order-row-name">${item.name}</div>
        <div class="qty-ctrl">
          <button class="qty-btn" onclick="changeQty(${item.id},-1)">−</button>
          <span class="qty-num">${item.qty}</span>
          <button class="qty-btn" onclick="changeQty(${item.id},1)">+</button>
        </div>
        <div class="order-row-price">${fmt(item.price*item.qty)}</div>
      </div>`).join('')
    : `<div class="empty-state">${noTable?'👆 Izberi mizo na levi':'Dodaj artikel iz seznama zgoraj'}</div>`;

  const badge = hasPass
    ? '<span class="status-badge ok">● Shopsy</span>'
    : '<span class="status-badge err">⚠ Nastavi geslo</span>';

  col.innerHTML = `
    <div class="topbar">
      <span class="topbar-title">${selectedTable?'Miza '+selectedTable:'Naročilo'}</span>
      ${badge}
    </div>
    <div class="add-section">
      <select id="itemSelect" ${noTable?'disabled':''}>${buildSelect()}</select>
      <button class="btn-add" onclick="addSelected()" ${noTable?'disabled':''}>+</button>
    </div>
    <div class="order-items">${rows}</div>
    <div class="order-footer">
      <div class="total-row">
        <span class="total-label">Skupaj</span>
        <span class="total-amount">${fmt(total)}</span>
      </div>
      <button class="btn-checkout ${!hasPass?'needs-setup':''}" onclick="${hasPass?'checkout()':'showSettings()'}">
        ${hasPass ? '📤 Pošlji v Shopsy' : '⚙️ Nastavi geslo'}
      </button>
      <button class="btn-clear" onclick="clearTable()" ${!order.length?'disabled':''}>🗑 Počisti mizo</button>
    </div>`;
}

function addSelected() {
  const sel = document.getElementById('itemSelect');
  if(!sel||!sel.value||!selectedTable) return;
  const id = parseInt(sel.value);
  const item = MENU.find(i=>i.id===id);
  if(!item) return;
  const order = orders[selectedTable];
  const ex = order.find(i=>i.id===id);
  if(ex) ex.qty++; else order.push({...item,qty:1});
  sel.value='';
  renderTables(); renderOrder();
}

function changeQty(id, delta) {
  if(!selectedTable) return;
  const order = orders[selectedTable];
  const idx = order.findIndex(i=>i.id===id);
  if(idx<0) return;
  order[idx].qty+=delta;
  if(order[idx].qty<=0) order.splice(idx,1);
  renderTables(); renderOrder();
}

function clearTable() {
  if(!selectedTable||!orders[selectedTable].length) return;
  if(confirm('Počisti mizo '+selectedTable+'?')) {
    orders[selectedTable]=[];
    renderAll();
  }
}

function checkout() {
  if(!selectedTable||!orders[selectedTable].length) return;
  const order = orders[selectedTable];
  const lines = order.map(i=>`${i.qty}× ${i.name} – ${fmt(i.price*i.qty)}`).join('\n');
  const t = tableTotal(selectedTable);
  const tbl = selectedTable;
  if(confirm('Pošlji v Shopsy?\n\nMiza '+tbl+'\n'+lines+'\n\nSkupaj: '+fmt(t))) {
    sendToShopsy(tbl);
  }
}

function showSettings() {
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.innerHTML = `
    <div class="modal">
      <h3>⚙️ Shopsy nastavitve</h3>
      <div class="settings-form">
        <label>Email</label>
        <input type="text" value="${EMAIL}" disabled style="opacity:0.6;">
        <label>Geslo</label>
        <input type="password" id="settingsPass" placeholder="Vnesi geslo..." value="${settings.password}" autocomplete="current-password">
      </div>
      <p class="settings-info">Store: Maloprodaja Orehovlje (6001)<br>Kupec: KONČNI KUPEC (000001)<br>Geslo se shrani lokalno v brskalnik.</p>
      <div class="modal-btns">
        <button onclick="this.closest('.modal-overlay').remove()">Zapri</button>
        <button class="primary" onclick="saveSettings()">Shrani</button>
      </div>
    </div>`;
  document.body.appendChild(overlay);
  setTimeout(() => document.getElementById('settingsPass')?.focus(), 100);
}

function saveSettings() {
  const p = document.getElementById('settingsPass');
  if(p) {
    settings.password = p.value.trim();
    localStorage.setItem('shopsy_pass', settings.password);
  }
  document.querySelector('.modal-overlay')?.remove();
  renderOrder();
  showToast('Nastavitve shranjene');
}

function renderAll() { renderTables(); renderOrder(); }
renderAll();
</script>
</body>
</html>
